{% extends "base.html" %}

{% block title %}Edit Project{% endblock %}

{% block body_class %}projects-page{% endblock %}

{% block content %}
  <h1>Edit project</h1>

  <form method="post" action="{{ url_for('edit_project', project_id=project['id']) }}">
    <div class="form-group">
      <label for="project-add">Project name:</label>
      <input
        type="text"
        id="project-add"
        name="project-add"
        value="{{ project['name'] }}"
        required
      >
    </div>

    <div class="description-group">
      <label for="project-description">Add a description:</label>
      <textarea id="project-description" name="project-description" required>{{ project['description'] }}</textarea>

    </div>

    <div class="form-group">
      <label for="status">Status:</label>
      <select id="status" name="status">
        <option value="not started" {% if project['status'] == 'not started' %}selected{% endif %}>Not Started</option>
        <option value="in progress" {% if project['status'] == 'in progress' %}selected{% endif %}>In Progress</option>
        <option value="completed" {% if project['status'] == 'completed' %}selected{% endif %}>Completed</option>
      </select>
    </div>

    <p><small>Added on: {{ project['formatted_ts'] }}</small></p>

    <button type="submit" class="button">Save changes</button>
  </form>
{% endblock %}
