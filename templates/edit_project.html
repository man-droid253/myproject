{% extends "base.html" %}

{% block title %}Edit Project{% endblock %}

{% block body_class %}projects-page{% endblock %}

{% block content %}
  <h1>Edit project</h1>

  <form method="post" action="{{ url_for('edit_project', project_id=project[0]) }}">
    <div class="form-group">
      <label for="project-add">Project name:</label>
      <input
        type="text"
        id="project-add"
        name="project-add"
        value="{{ project[1] }}"
        required
      >
    </div>

    <div class="description-group">
      <label for="project-description">Add a description:</label>
      <textarea id="project-description" name="project-description" required>{{ project[2] }}</textarea>
    </div>

    <button type="submit" class="button">Save changes</button>
  </form>
{% endblock %}
